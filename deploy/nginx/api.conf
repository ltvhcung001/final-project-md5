# Install on the server:
#   sudo cp api.conf /etc/nginx/sites-available/omnichannel
#   sudo sed -i 's/DOMAIN/54-12-34-56.sslip.io/g' /etc/nginx/sites-available/omnichannel   # your domain
#   sudo ln -s /etc/nginx/sites-available/omnichannel /etc/nginx/sites-enabled/omnichannel
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.DOMAIN -d grafana.DOMAIN      # adds TLS + the HTTP -> HTTPS redirect
#
# This file is intentionally HTTP only: certbot rewrites it to add the 443 server blocks and certificates.

server {
    listen 80;
    server_name api.DOMAIN;

    client_max_body_size 5m;

    # metrics/health stay internal (Prometheus scrapes the containers directly)
    location /actuator { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Only needed when the "monitoring" compose profile is enabled
server {
    listen 80;
    server_name grafana.DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
