# Local development infrastructure only (run the Spring services from your IDE).
#   docker compose -f deploy/docker-compose.local.yml up -d
# Ports are published here for convenience; never do this in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      IDENTITY_DB_PASSWORD: identity
      ORDER_DB_PASSWORD: orders
      PAYMENT_DB_PASSWORD: payment
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
