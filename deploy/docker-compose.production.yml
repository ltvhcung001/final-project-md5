# Production stack. Run from the deploy/ directory: docker compose -f docker-compose.production.yml up -d
# Only the gateway publishes a port, bound to 127.0.0.1 (Nginx proxies to it).
# Databases, Redis and RabbitMQ are reachable on backend-network only (Docker bypasses UFW for published ports).

x-java-service: &java-service
  restart: unless-stopped
  networks: [backend-network]
  environment: &java-env
    JAVA_TOOL_OPTIONS: "-Xmx${JAVA_XMX:-256m}"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
  deploy:
    resources:
      limits:
        memory: 512m

services:
  # ---------- application services ----------
  api-gateway:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/omnichannel-api-gateway:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *java-env
      IDENTITY_URL: http://identity-service:8081
      PRODUCT_URL: http://product-service:8082
      ORDER_URL: http://order-inventory-service:8083
      PAYMENT_URL: http://payment-service:8084
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      identity-service: { condition: service_healthy }

  identity-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/omnichannel-identity-service:${IMAGE_TAG:-latest}
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/omnichannel-product-service:${IMAGE_TAG:-latest}
    environment:
      <<: *java-env
      MONGO_URI: mongodb://mongodb:27017/product_db
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mongodb: { condition: service_healthy }

  order-inventory-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/omnichannel-order-inventory-service:${IMAGE_TAG:-latest}
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USER: orders
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      REDIS_HOST: redis
      PRODUCT_GRPC_ADDRESS: static://product-service:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payment-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/omnichannel-payment-service:${IMAGE_TAG:-latest}
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: https://api.${DOMAIN}/api/payments/return/vnpay
      MOMO_IPN_URL: https://api.${DOMAIN}/api/payments/ipn/momo
      MOMO_REDIRECT_URL: https://api.${DOMAIN}/api/payments/return/momo
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/omnichannel-notification-service:${IMAGE_TAG:-latest}
    environment:
      <<: *java-env
      MONGO_URI: mongodb://mongodb:27017/notification_db
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ---------- infrastructure ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend-network]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  mongodb:
    image: mongo:7
    restart: unless-stopped
    networks: [backend-network]
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  elasticsearch:
    profiles: ["search"]   # optional, needs ~1 GB RAM; enable with --profile search and SEARCH_ENABLED=true
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    networks: [backend-network]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend-network]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192m

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    networks: [backend-network]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  # ---------- monitoring ----------
  prometheus:
    profiles: ["monitoring"]   # enable with: --profile monitoring
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [backend-network]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  loki:
    profiles: ["monitoring"]   # enable with: --profile monitoring
    image: grafana/loki:3.2.1
    restart: unless-stopped
    networks: [backend-network]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  promtail:
    profiles: ["monitoring"]   # enable with: --profile monitoring
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    networks: [backend-network]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    profiles: ["monitoring"]   # enable with: --profile monitoring
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    networks: [backend-network]
    ports:
      - "127.0.0.1:3000:3000"   # Nginx proxies grafana.<domain> here
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  backend-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  es-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:
