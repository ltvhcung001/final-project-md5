global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - identity-service:8081
          - product-service:8082
          - order-inventory-service:8083
          - payment-service:8084
          - notification-service:8085

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]   # needs the rabbitmq_prometheus plugin (enabled by default in the management image)

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
