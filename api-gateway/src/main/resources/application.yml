server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: product-service
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/brands/**
            - id: order-inventory-service
              uri: ${ORDER_URL:http://localhost:8083}
              predicates:
                - Path=/api/orders/**,/api/inventory/**
            - id: payment-service
              uri: ${PAYMENT_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**,/api/payments

            # aggregated Swagger: the gateway serves each service's OpenAPI document under /v3/api-docs/<name>
            - id: docs-identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/identity
              filters:
                - SetPath=/v3/api-docs
            - id: docs-product
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/product
              filters:
                - SetPath=/v3/api-docs
            - id: docs-order
              uri: ${ORDER_URL:http://localhost:8083}
              predicates:
                - Path=/v3/api-docs/order
              filters:
                - SetPath=/v3/api-docs
            - id: docs-payment
              uri: ${PAYMENT_URL:http://localhost:8084}
              predicates:
                - Path=/v3/api-docs/payment
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    urls:
      - { name: identity, url: /v3/api-docs/identity }
      - { name: product, url: /v3/api-docs/product }
      - { name: order, url: /v3/api-docs/order }
      - { name: payment, url: /v3/api-docs/payment }
    persist-authorization: true
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

gateway:
  jwt:
    # HS256 secret, must be shared with identity-service (min 32 bytes)
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
