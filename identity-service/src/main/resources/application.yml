server:
  port: 8081

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

identity:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-ttl: PT15M
    refresh-ttl: P7D
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
