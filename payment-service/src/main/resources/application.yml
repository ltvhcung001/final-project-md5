server:
  port: 8084

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # after retries the message goes to the .dlq queue
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2

payment:
  # MOCK provider: fake payment page for demos / load tests. Turn off when only real providers should be used.
  mock:
    enabled: ${PAYMENT_MOCK_ENABLED:true}
  outbox-poll-interval-ms: 1000
  vnpay:
    # sandbox values; supply real sandbox credentials via environment
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/return/vnpay}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    endpoint: https://test-payment.momo.vn/v2/gateway/api/create
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/ipn/momo}
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:8080/api/payments/return/momo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
