server:
  port: 8082

spring:
  application:
    name: product-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/product_db}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

search:
  elasticsearch:
    # false = search falls back to MongoDB (use on small servers with < 4 GB RAM)
    enabled: ${SEARCH_ENABLED:false}

grpc:
  server:
    port: 9092

management:
  health:
    elasticsearch:
      enabled: ${SEARCH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
