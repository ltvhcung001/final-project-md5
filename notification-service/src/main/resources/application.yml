server:
  port: 8085

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/notification_db}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # after retries the message goes to notification.events.dlq
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

notification:
  from: no-reply@omnichannel.local

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
